# Type-checks, runs the unit tests and builds on every push and pull request.
#
# The build is part of the check on purpose: it runs the singleton check
# (scripts/check-singletons.mjs) and tests/build/bundle.test.ts verifies the
# IDE stays out of the page-load bundle.
#
# The browser end-to-end suite (`bun run test:e2e`) needs installed browsers
# and runs locally, not here.
#
# The token can only read, and the checkout keeps no credentials on disk.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: Build both browser packages
        run: bun run build
