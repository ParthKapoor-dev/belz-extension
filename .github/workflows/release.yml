# Builds, signs, and publishes the browser extension.
#
# Trigger: push a tag like `v1.2.3`.
#
# What it does:
#   1. Type-checks and runs the unit tests: nothing is built from a tag that fails them.
#   2. Builds per-browser extension trees (scripts/pack.mjs).
#   3. Packs a signed Chromium CRX (key from the CHROME_CRX_KEY secret).
#   4. Signs a Firefox XPI via the Mozilla AMO API (unlisted channel).
#   5. Generates the update manifests (updates.xml / updates.json).
#   6. Attaches the CRX + XPI to the GitHub Release and publishes the update
#      manifests to GitHub Pages at a stable URL.
#
# Force-installed browsers auto-update from the Pages-hosted manifests whenever
# a new `v*` tag is pushed.
#
# Supply chain: every action is pinned to a full commit SHA (the tag it came
# from is in the comment), Bun to an exact version, and the signing tools (crx3,
# web-ext) to the exact devDependency versions in package.json and bun.lock,
# installed with the rest by `bun install --frozen-lockfile`. To update one,
# change the SHA and its comment together.
#
# Secrets: the CRX key exists on disk only inside the step that signs, and is
# shredded by an always() step even if signing fails. The AMO credentials are
# given to the one step that uses them, as environment variables.
#
# Least privilege: the workflow's token can only read by default. The release
# job may write repository contents (to create the GitHub Release), and only
# deploy-pages may publish to Pages. The checkout keeps no credentials on
# disk, and no workflow expression is expanded inside a script: values reach
# `run:` blocks as environment variables.
#
# Required repository secrets:
#   CHROME_CRX_KEY    PEM private key for CRX signing. Generate ONCE and never
#                     rotate — the key determines the stable Chrome extension
#                     ID. Create: `openssl genrsa 2048 > key.pem`.
#   AMO_JWT_ISSUER    Mozilla add-ons API key      (addons.mozilla.org → Manage API Keys)
#   AMO_JWT_SECRET    Mozilla add-ons API secret
#
# One-time setup: enable GitHub Pages (Settings → Pages → source: GitHub Actions)
# and, after the first run, copy the printed Chrome extension ID into
# release.config.json (`chromeId`).

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    permissions:
      contents: write   # create/update the GitHub Release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.20

      - name: Resolve version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: Build per-browser extension trees
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: node scripts/pack.mjs --version "$VERSION"

      - name: Pack signed Chromium CRX
        id: crx
        env:
          CHROME_CRX_KEY: ${{ secrets.CHROME_CRX_KEY }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          umask 077
          printf '%s' "$CHROME_CRX_KEY" > key.pem
          mkdir -p dist-pack
          # -p is crx3's key option; with any other flag it signs with a new,
          # random key and the extension ID changes.
          ./node_modules/.bin/crx3 -p key.pem \
            -o "dist-pack/belz-extension-$VERSION.crx" \
            build/chrome < /dev/null
          # Derive the deterministic Chrome extension ID from the public key.
          ID=$(node -e '
            const {execSync}=require("child_process");const crypto=require("crypto");
            const der=execSync("openssl rsa -in key.pem -pubout -outform DER 2>/dev/null");
            const h=crypto.createHash("sha256").update(der).digest();
            process.stdout.write([...h.subarray(0,16)].map(b=>
              ("0123456789abcdef"[b>>4])+("0123456789abcdef"[b&15])).join("")
              .replace(/[0-9a-f]/g,c=>"abcdefghijklmnop"[parseInt(c,16)]));
          ')
          if [ -z "$ID" ]; then echo "::error::could not derive the Chrome extension ID from CHROME_CRX_KEY"; exit 1; fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "Chrome extension ID: $ID"

      - name: Remove the CRX key
        if: always()
        run: |
          if [ -f key.pem ]; then shred -u key.pem 2>/dev/null || rm -f key.pem; fi

      - name: Sign Firefox XPI via AMO
        id: xpi
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          ./node_modules/.bin/web-ext sign \
            --source-dir=build/firefox \
            --channel=unlisted \
            --api-key="$AMO_JWT_ISSUER" \
            --api-secret="$AMO_JWT_SECRET" \
            --artifacts-dir=dist-pack
          # A sign that "succeeded" without producing an XPI must not publish
          # an updates.json with an empty update_link.
          XPI=$(find dist-pack -maxdepth 1 -name '*.xpi' | head -1)
          if [ -z "$XPI" ]; then echo "::error::web-ext sign produced no .xpi"; exit 1; fi
          echo "xpi=$XPI" >> "$GITHUB_OUTPUT"

      - name: Generate update manifests
        env:
          V: ${{ steps.ver.outputs.version }}
          XPI: ${{ steps.xpi.outputs.xpi }}
          CRX_ID: ${{ steps.crx.outputs.id }}
        run: |
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          FF_ID=$(node -e 'console.log(require("./release.config.json").firefoxId)')
          CRX="dist-pack/belz-extension-$V.crx"
          XPI_NAME=$(basename "$XPI")
          if [ -z "$XPI_NAME" ] || [ ! -f "$XPI" ]; then echo "::error::no signed XPI to publish"; exit 1; fi
          if [ ! -f "$CRX" ]; then echo "::error::no CRX to publish"; exit 1; fi
          mkdir -p pages
          cp "$CRX" "$XPI" pages/
          # Stable "latest" copies — Firefox force-install points install_url here.
          cp "$CRX" pages/belz-extension-latest.crx
          cp "$XPI" pages/belz-extension-latest.xpi
          cat > pages/updates.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <gupdate xmlns="http://www.google.com/update2/response" protocol="2.0">
            <app appid="$CRX_ID">
              <updatecheck codebase="$BASE/belz-extension-$V.crx" version="$V"/>
            </app>
          </gupdate>
          EOF
          cat > pages/updates.json <<EOF
          { "addons": { "$FF_ID": { "updates": [
            { "version": "$V", "update_link": "$BASE/$XPI_NAME" } ] } } }
          EOF

      - name: Publish packages to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          XPI: ${{ steps.xpi.outputs.xpi }}
        run: |
          TAG="$GITHUB_REF_NAME"
          # Re-running the workflow for a tag finds its release already there:
          # that is the one tolerated case. Any other failure fails the job.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; uploading into it"
          else
            gh release create "$TAG" --title "$TAG" --notes "Automated release."
          fi
          gh release upload "$TAG" "dist-pack/belz-extension-$VERSION.crx" "$XPI" --clobber

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: pages

  deploy-pages:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
