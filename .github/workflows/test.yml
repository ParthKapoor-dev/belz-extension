# Type-checks, runs the unit tests and builds on every push and pull request.
#
# The build is part of the check on purpose: it runs the singleton check
# (scripts/check-singletons.mjs) and tests/build/bundle.test.ts verifies the
# editor stays out of the page-load bundle.
#
# The browser end-to-end suite (`bun run test:e2e`) is run locally for now.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: Build both browser packages
        run: bun run build
